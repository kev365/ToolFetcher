# Crypto and Password Recovery Tools

# Field reference: see _tool_template.yaml
# Documentation:   https://dfir-kev.medium.com/tool-fetcher-86691e65731b

category: "crypto_password_recovery"
tools:

  - Name: "CyberChef" # confirmed 2026-11-02
    RepoUrl: "https://github.com/gchq/CyberChef"
    DownloadMethod: "latestRelease"
    AssetFilename: "CyberChef_.*\\.zip" # assets are named CyberChef_<commit>.zip since v11.1.0
    OutputFolder: "decoders"
    SkipDownload: false

  - Name: "hasher" # confirmed 2026-11-02
    RepoUrl: "https://download.ericzimmermanstools.com/net/hasher.zip"
    DownloadMethod: "specificFile"
    OutputFolder: "hashers"
    DownloadName: "hasher.zip"
    SkipDownload: false

  - Name: "Hashcat" # confirmed 2026-11-02
    RepoUrl: "https://github.com/hashcat/hashcat"
    DownloadMethod: "latestRelease"
    AssetFilename: "hashcat-.*\\.7z$" # anchored: the release also ships a .7z.asc signature
    OutputFolder: "password_recovery"
    SkipDownload: false

  - Name: "john" # confirmed 2026-11-02
    RepoUrl: "https://www.openwall.com/john/k/john-1.9.0-jumbo-1-win64.zip" # openwall/john has no GitHub releases; 1.9.0-jumbo-1 is the current Windows build
    DownloadMethod: "specificFile"
    OutputFolder: "password_recovery"
    SkipDownload: false

  - Name: "KeeFarce" # confirmed 2026-11-02
    RepoUrl: "https://github.com/denandz/KeeFarce"
    DownloadMethod: "branchZip"
    Branch: "master"
    OutputFolder: "password_recovery"
    SkipDownload: false

  - Name: "ophcrack"
    RepoUrl: ""
    DownloadMethod: ""
    DownloadName: ""
    OutputFolder: "password_recovery"
    SkipDownload: true

  - Name: "passrecenc"
    RepoUrl: ""
    DownloadMethod: ""
    DownloadName: ""
    OutputFolder: "password_recovery"
    SkipDownload: true
