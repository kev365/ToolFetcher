# Crypto and Password Recovery Tools

# Field reference: see _tool_template.yaml
# Documentation:   https://dfir-kev.medium.com/tool-fetcher-86691e65731b

tools:
 
  - Name: "CyberChef"
    RepoUrl: "https://github.com/gchq/CyberChef"
    DownloadMethod: "latestRelease"
    AssetFilename: "CyberChef_v.*\\.zip"
    OutputFolder: "decoders"
    SkipDownload: false

  - Name: "hasher"
    RepoUrl: "https://download.ericzimmermanstools.com/hasher.zip"
    DownloadMethod: "specificFile"
    OutputFolder: "hashers"
    DownloadName: "hasher.zip"
    SkipDownload: false

  - Name: "Hashcat"
    RepoUrl: "https://github.com/hashcat/hashcat"
    DownloadMethod: "latestRelease"
    AssetFilename: "hashcat-.*\\.7z"
    OutputFolder: "password_recovery"
    SkipDownload: false

  - Name: "john"
    RepoUrl: "https://github.com/openwall/john"
    DownloadMethod: "latestRelease"
    AssetFilename: "john-.*-jumbo-.*-win64\\.zip"
    OutputFolder: "password_recovery"
    SkipDownload: false

  - Name: "KeeFarce"
    RepoUrl: "https://github.com/denandz/KeeFarce"
    DownloadMethod: "branchZip"
    Branch: "master"
    OutputFolder: "password_recovery"
    SkipDownload: false

  - Name: "ophcrack"
    RepoUrl: ""
    DownloadMethod: ""
    DownloadName: ""
    OutputFolder: "password_recovery"
    SkipDownload: false

  - Name: "passrecenc"
    RepoUrl: ""
    DownloadMethod: ""
    DownloadName: ""
    OutputFolder: "password_recovery"
    SkipDownload: false 