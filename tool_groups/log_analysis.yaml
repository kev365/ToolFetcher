# Log Analysis Tools

# Field reference: see _tool_template.yaml
# Documentation:   https://dfir-kev.medium.com/tool-fetcher-86691e65731b

tools:
  
  - Name: "APT-Hunter"
    RepoUrl: "https://github.com/ahmedkhlief/APT-Hunter"
    DownloadMethod: "latestRelease"
    DownloadName: "APT-Hunter.zip"
    OutputFolder: "logs"
    SkipDownload: false

  - Name: "chainsaw"
    RepoUrl: "https://github.com/WithSecureLabs/chainsaw"
    DownloadMethod: "latestRelease"
    DownloadName: "chainsaw_x86_64-pc-windows-msvc.zip"
    OutputFolder: "logs"
    SkipDownload: false

  - Name: "EvtxECmd"
    RepoUrl: "https://download.ericzimmermanstools.com/net6/EvtxECmd.zip"
    DownloadMethod: "specificFile"
    OutputFolder: "logs"
    SkipDownload: false

  - Name: "EvtxHussar"
    RepoUrl: "https://github.com/yarox24/EvtxHussar"
    DownloadMethod: "latestRelease"
    AssetType: "win64"
    OutputFolder: "logs"
    SkipDownload: false

  - Name: "hayabusa"
    RepoUrl: "https://github.com/Yamato-Security/hayabusa"
    DownloadMethod: "latestRelease"
    AssetType: "win64"
    OutputFolder: "logs"
    SkipDownload: false

  - Name: "hayabusa-rules"
    RepoUrl: "https://github.com/Yamato-Security/hayabusa-rules"
    DownloadMethod: "branchZip"
    Branch: "main"
    OutputFolder: "logs"
    SkipDownload: false

  - Name: "hindsight"
    RepoUrl: "https://github.com/obsidianforensics/hindsight"
    DownloadMethod: "latestRelease"
    DownloadName: "hindsight.exe"
    OutputFolder: "logs"
    SkipDownload: false

  - Name: "hindsight_gui"
    RepoUrl: "https://github.com/obsidianforensics/hindsight"
    DownloadMethod: "latestRelease"
    DownloadName: "hindsight_gui.exe"
    OutputFolder: "logs"
    SkipDownload: false

  - Name: "SumECmd"
    RepoUrl: "https://download.ericzimmermanstools.com/net6/SumECmd.zip"
    DownloadMethod: "specificFile"
    OutputFolder: "logs"
    SkipDownload: false 