# Memory Analysis Tools

# Field reference: see _tool_template.yaml
# Documentation:   https://dfir-kev.medium.com/tool-fetcher-86691e65731b

category: "memory_analysis"
tools:

  - Name: "capa" # confirmed 2026-09-16
    RepoUrl: "https://github.com/mandiant/capa"
    DownloadMethod: "latestRelease"
    AssetFilename: "capa-v.*-windows\\.zip"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "CobaltStrikeParser" # confirmed 2026-09-16
    RepoUrl: "https://github.com/Sentinel-One/CobaltStrikeParser" # archived repo, no releases
    DownloadMethod: "branchZip"
    Branch: "master"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "libcsce"
    RepoUrl: ""
    DownloadMethod: ""
    Branch: ""
    OutputFolder: "memory"
    SkipDownload: true

  - Name: "MemProcFs" # confirmed 2026-09-16
    RepoUrl: "https://github.com/ufrisk/MemProcFS"
    DownloadMethod: "latestrelease"
    DownloadName: "MemProcFS_files_and_binaries-win_x64-latest.zip"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "MemProcFsAnalyzer" # confirmed 2026-09-16
    RepoUrl: "https://github.com/LETHAL-FORENSICS/MemProcFS-Analyzer"
    DownloadMethod: "latestrelease"
    AssetFilename: "MemProcFS-Analyzer-v.*\\.zip"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "RdpCacheStitcher" # confirmed 2026-09-16
    RepoUrl: "https://github.com/BSI-Bund/RdpCacheStitcher/"
    DownloadMethod: "latestrelease"
    AssetFilename: "RdpCacheStitcher-.*-win64\\.zip"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "scdbg"
    RepoUrl: ""
    DownloadMethod: ""
    Branch: ""
    OutputFolder: "memory"
    SkipDownload: true

  - Name: "vol2" # confirmed 2026-09-16
    RepoUrl: "https://github.com/volatilityfoundation/volatility" # archived repo; the develop branch is gone, release 2.6.1 ships a Windows x64 standalone
    DownloadMethod: "latestRelease"
    AssetFilename: "volatility_.*_win64_standalone\\.zip"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "vol3" # confirmed 2026-09-16
    RepoUrl: "https://github.com/volatilityfoundation/volatility3"
    DownloadMethod: "branchZip"
    Branch: "develop"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "WMI_Forensics" # confirmed 2026-09-16
    RepoUrl: "https://github.com/davidpany/WMI_Forensics"
    DownloadMethod: "branchZip"
    Branch: "master"
    OutputFolder: "memory"
    SkipDownload: false
