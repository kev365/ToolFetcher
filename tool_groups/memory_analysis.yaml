# Memory Analysis Tools

# Field reference: see _tool_template.yaml
# Documentation:   https://dfir-kev.medium.com/tool-fetcher-86691e65731b

tools:
  
  - Name: "capa"
    RepoUrl: "https://github.com/mandiant/capa"
    DownloadMethod: "latestRelease"
    AssetFilename: "capa-v.*-windows\\.zip"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "CobaltStrikeParser"
    RepoUrl: "https://github.com/Sentinel-One/CobaltStrikeParser"
    DownloadMethod: "latestRelease"
    DownloadName: "CobaltStrikeParser.zip"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "libcsce"
    RepoUrl: ""
    DownloadMethod: ""
    Branch: ""
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "MemProcFs"
    RepoUrl: "https://github.com/ufrisk/MemProcFS"
    DownloadMethod: "latestrelease"
    DownloadName: "MemProcFS_files_and_binaries-win_x64-latest.zip"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "MemProcFsAnalyzer"
    RepoUrl: "https://github.com/LETHAL-FORENSICS/MemProcFS-Analyzer"
    DownloadMethod: "latestrelease"
    AssetFilename: "MemProcFS-Analyzer-v.*\\.zip"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "RdpCacheStitcher"
    RepoUrl: "https://github.com/BSI-Bund/RdpCacheStitcher/"
    DownloadMethod: "latestrelease"
    AssetFilename: "RdpCacheStitcher-.*-win64\\.zip"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "scdbg"
    RepoUrl: ""
    DownloadMethod: ""
    Branch: ""
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "vol2"
    RepoUrl: "https://github.com/volatilityfoundation/volatility"
    DownloadMethod: "branchZip"
    Branch: "develop"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "vol3"
    RepoUrl: "https://github.com/volatilityfoundation/volatility3"
    DownloadMethod: "branchZip"
    Branch: "develop"
    OutputFolder: "memory"
    SkipDownload: false

  - Name: "WMI_Forensics"
    RepoUrl: "https://github.com/davidpany/WMI_Forensics"
    DownloadMethod: "branchZip"
    Branch: "master"
    OutputFolder: "memory"
    SkipDownload: false 